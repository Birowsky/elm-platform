name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Kernel and wrapper tests
        run: npm test

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E
        run: npm run e2e
